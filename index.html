<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f5f1">
  <title>随机点名</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #202824;
      background: #f3f5f1;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --ink: #202824;
      --muted: #68736d;
      --line: #e2e7e2;
      --green: #16745e;
      --green-dark: #105d4b;
      --paper: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 36px 24px 56px;
    }

    button, input, textarea { font: inherit; }
    button { color: inherit; }

    .app {
      width: min(1120px, 100%);
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 28px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border-radius: 8px;
      background: #dcece5;
      color: var(--green);
    }

    .brand-mark svg { width: 23px; height: 23px; }

    h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
      line-height: 1.25;
    }

    .privacy-note {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(330px, 0.85fr);
      align-items: start;
      gap: 20px;
    }

    .draw-panel, .manage-panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
    }

    .draw-panel { padding: 28px; }

    .panel-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    h2, h3 { margin: 0; }

    h2 {
      font-size: 16px;
      font-weight: 650;
    }

    .roster-count {
      color: var(--muted);
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }

    .result-stage {
      display: flex;
      min-height: 280px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 20px 0 22px;
      padding: 28px 20px;
      border: 1px solid #dfece6;
      border-radius: 8px;
      background: #f4f9f6;
      text-align: center;
    }

    .result-caption {
      margin: 0 0 14px;
      color: var(--green);
      font-size: 12px;
      font-weight: 700;
    }

    .result-name {
      max-width: 100%;
      overflow-wrap: anywhere;
      color: #163c31;
      font-size: 48px;
      font-weight: 750;
      line-height: 1.16;
    }

    .result-empty {
      color: #78837d;
      font-size: 15px;
    }

    .winners-list {
      display: grid;
      width: 100%;
      max-height: 280px;
      gap: 8px;
      overflow-y: auto;
      text-align: center;
    }

    .winner-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border: 1px solid #dfece6;
      border-radius: 6px;
      background: #fff;
    }

    .winner-number {
      display: grid;
      width: 27px;
      height: 27px;
      flex: 0 0 27px;
      place-items: center;
      border-radius: 50%;
      background: #e7f2ed;
      color: var(--green);
      font-size: 12px;
      font-weight: 700;
    }

    .winner-name {
      overflow-wrap: anywhere;
      font-size: 18px;
      font-weight: 650;
    }

    .draw-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    .control-label {
      color: #49544e;
      font-size: 14px;
      font-weight: 600;
    }

    .stepper {
      display: flex;
      height: 40px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
    }

    .stepper button {
      width: 40px;
      height: 38px;
      border: 0;
      background: transparent;
      color: var(--green);
      cursor: pointer;
      font-size: 20px;
    }

    .stepper button:disabled { color: #aab3ad; cursor: default; }

    .stepper input {
      width: 48px;
      height: 38px;
      padding: 0;
      border: 0;
      outline: 0;
      color: var(--ink);
      font-size: 15px;
      font-weight: 650;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .stepper input::-webkit-inner-spin-button,
    .stepper input::-webkit-outer-spin-button { margin: 0; appearance: none; }

    .draw-button {
      display: flex;
      width: 100%;
      min-height: 50px;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 0;
      border-radius: 6px;
      background: var(--green);
      color: #fff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
      transition: background 140ms ease, transform 140ms ease;
    }

    .draw-button:hover:not(:disabled) { background: var(--green-dark); }
    .draw-button:active:not(:disabled) { transform: translateY(1px); }
    .draw-button:disabled { background: #aab8b1; cursor: not-allowed; }
    .draw-button svg { width: 19px; height: 19px; }

    .manage-panel { padding: 24px; }

    .section + .section {
      margin-top: 24px;
      padding-top: 22px;
      border-top: 1px solid var(--line);
    }

    h3 {
      font-size: 15px;
      font-weight: 700;
    }

    .text-button {
      min-height: 32px;
      padding: 4px 8px;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
    }

    .text-button:hover:not(:disabled) { background: #f1f4f1; color: var(--ink); }
    .text-button:disabled { color: #aeb7b1; cursor: default; }

    .roster-input {
      display: block;
      width: 100%;
      min-height: 180px;
      margin-top: 14px;
      padding: 12px 13px;
      resize: vertical;
      border: 1px solid #d8dfd9;
      border-radius: 6px;
      outline: none;
      background: #fcfdfc;
      color: var(--ink);
      font-size: 14px;
      line-height: 1.7;
      transition: border-color 140ms ease, box-shadow 140ms ease;
    }

    .roster-input:focus, .add-input:focus, .stepper:focus-within {
      border-color: #6da693;
      box-shadow: 0 0 0 3px #e5f1eb;
    }

    .roster-input::placeholder, .add-input::placeholder { color: #9aa49e; }

    .field-note {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .add-row {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    .add-input {
      min-width: 0;
      height: 40px;
      flex: 1;
      padding: 0 11px;
      border: 1px solid #d8dfd9;
      border-radius: 6px;
      outline: none;
      background: #fff;
      font-size: 13px;
    }

    .add-button {
      min-width: 66px;
      padding: 0 13px;
      border: 1px solid #c7ddd2;
      border-radius: 6px;
      background: #e9f3ee;
      color: var(--green-dark);
      cursor: pointer;
      font-size: 13px;
      font-weight: 650;
    }

    .add-button:hover { background: #dcece4; }

    .history-list {
      display: grid;
      gap: 0;
      margin-top: 10px;
    }

    .history-entry {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding: 11px 0;
      border-bottom: 1px solid #edf0ed;
    }

    .history-entry:last-child { border-bottom: 0; }

    .history-names {
      overflow-wrap: anywhere;
      color: #38433d;
      font-size: 13px;
      line-height: 1.55;
    }

    .history-time {
      flex: 0 0 auto;
      color: #87918b;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    .history-empty {
      margin: 12px 0 2px;
      color: #87918b;
      font-size: 13px;
    }

    :focus-visible { outline: 3px solid #9bc8b6; outline-offset: 2px; }

    @media (max-width: 760px) {
      body { padding: 22px 16px 36px; }
      .topbar { align-items: flex-start; margin-bottom: 20px; }
      .privacy-note { max-width: 130px; padding-top: 5px; text-align: right; line-height: 1.45; }
      .layout { grid-template-columns: minmax(0, 1fr); gap: 14px; }
      .draw-panel { padding: 20px; }
      .manage-panel { padding: 20px; }
      .result-stage { min-height: 230px; }
      .result-name { font-size: 36px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 6h12M8 12h12M8 18h12" />
            <path d="m3 6 1.2 1.2L6 5.4M3 12l1.2 1.2L6 11.4M3 18l1.2 1.2L6 17.4" />
          </svg>
        </div>
        <h1>随机点名</h1>
      </div>
      <p class="privacy-note">名单只保存在当前浏览器</p>
    </header>

    <div class="layout">
      <section class="draw-panel" aria-labelledby="draw-title">
        <div class="panel-heading">
          <h2 id="draw-title">抽取结果</h2>
          <span class="roster-count" id="draw-roster-count">名单 0 人</span>
        </div>

        <div class="result-stage" id="result-stage" aria-live="polite" aria-atomic="true">
          <p class="result-caption" id="result-caption">等待开始</p>
          <div class="result-empty" id="result-empty">添加名单后即可抽取</div>
          <div class="winners-list" id="winners-list" hidden></div>
        </div>

        <div class="draw-controls">
          <label class="control-label" for="draw-count">抽取人数</label>
          <div class="stepper">
            <button type="button" id="decrease-count" aria-label="减少抽取人数" title="减少">−</button>
            <input id="draw-count" type="number" min="1" max="1" value="1" inputmode="numeric" aria-label="抽取人数">
            <button type="button" id="increase-count" aria-label="增加抽取人数" title="增加">+</button>
          </div>
        </div>

        <button class="draw-button" id="draw-button" type="button" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.64 5.64l1.42 1.42m9.88 9.88 1.42 1.42m0-12.72-1.42 1.42m-9.88 9.88-1.42 1.42" />
            <circle cx="12" cy="12" r="5" />
          </svg>
          <span id="draw-button-label">开始抽取</span>
        </button>
      </section>

      <aside class="manage-panel" aria-label="名单与抽取记录">
        <section class="section" aria-labelledby="roster-title">
          <div class="panel-heading">
            <h3 id="roster-title">班级名单</h3>
            <button class="text-button" id="clear-roster" type="button" disabled>清空名单</button>
          </div>
          <textarea class="roster-input" id="roster-input" placeholder="每行输入一个姓名" aria-label="班级名单，每行一个姓名"></textarea>
          <p class="field-note">每行一个姓名，空行会忽略，重复姓名按一人计算。</p>
          <form class="add-row" id="add-form">
            <input class="add-input" id="add-name" type="text" maxlength="40" placeholder="添加一位同学" aria-label="添加一位同学">
            <button class="add-button" type="submit">添加</button>
          </form>
        </section>

        <section class="section" aria-labelledby="history-title">
          <div class="panel-heading">
            <h3 id="history-title">最近抽取</h3>
            <button class="text-button" id="clear-history" type="button" disabled>清空记录</button>
          </div>
          <div class="history-list" id="history-list" aria-live="polite"></div>
        </section>
      </aside>
    </div>
  </main>

  <script>
    (() => {
      const rosterInput = document.querySelector("#roster-input");
      const addForm = document.querySelector("#add-form");
      const addName = document.querySelector("#add-name");
      const drawCountInput = document.querySelector("#draw-count");
      const drawButton = document.querySelector("#draw-button");
      const drawButtonLabel = document.querySelector("#draw-button-label");
      const resultCaption = document.querySelector("#result-caption");
      const resultEmpty = document.querySelector("#result-empty");
      const winnersList = document.querySelector("#winners-list");
      const historyList = document.querySelector("#history-list");
      const drawRosterCount = document.querySelector("#draw-roster-count");
      const clearRosterButton = document.querySelector("#clear-roster");
      const clearHistoryButton = document.querySelector("#clear-history");
      const decreaseCountButton = document.querySelector("#decrease-count");
      const increaseCountButton = document.querySelector("#increase-count");

      const rosterKey = "random-roll-call-roster-v1";
      const historyKey = "random-roll-call-history-v1";
      const historyLimit = 10;
      let names = [];
      let history = [];
      let lastWinner = "";
      let isDrawing = false;

      function readStorage(key, fallback) {
        try {
          const value = localStorage.getItem(key);
          return value === null ? fallback : value;
        } catch {
          return fallback;
        }
      }

      function saveStorage(key, value) {
        try {
          localStorage.setItem(key, value);
        } catch {
          // The current session remains usable when browser storage is unavailable.
        }
      }

      function getNames(value) {
        return [...new Set(value.split(/\r?\n/).map((name) => name.trim()).filter(Boolean))];
      }

      function syncCountControl() {
        const max = Math.max(1, names.length);
        const requested = Number.parseInt(drawCountInput.value, 10);
        drawCountInput.max = String(max);
        drawCountInput.value = String(Math.min(Math.max(requested || 1, 1), max));
        decreaseCountButton.disabled = Number(drawCountInput.value) <= 1;
        increaseCountButton.disabled = Number(drawCountInput.value) >= max;
      }

      function updateRoster() {
        names = getNames(rosterInput.value);
        saveStorage(rosterKey, rosterInput.value);
        drawRosterCount.textContent = `名单 ${names.length} 人`;
        clearRosterButton.disabled = rosterInput.value.length === 0;
        drawButton.disabled = names.length === 0 || isDrawing;
        if (!names.includes(lastWinner)) lastWinner = "";
        syncCountControl();
      }

      function randomIndex(length) {
        if (window.crypto && window.crypto.getRandomValues) {
          const values = new Uint32Array(1);
          const range = 0x100000000;
          const limit = Math.floor(range / length) * length;
          do {
            window.crypto.getRandomValues(values);
          } while (values[0] >= limit);
          return values[0] % length;
        }
        return Math.floor(Math.random() * length);
      }

      function shuffled(items) {
        const result = [...items];
        for (let index = result.length - 1; index > 0; index -= 1) {
          const swapIndex = randomIndex(index + 1);
          [result[index], result[swapIndex]] = [result[swapIndex], result[index]];
        }
        return result;
      }

      function setResult(namesToShow, caption) {
        resultCaption.textContent = caption;
        resultEmpty.hidden = namesToShow.length > 0;
        winnersList.hidden = namesToShow.length === 0;
        winnersList.replaceChildren();

        if (namesToShow.length === 0) {
          resultEmpty.textContent = "添加名单后即可抽取";
          return;
        }

        if (namesToShow.length === 1) {
          const name = document.createElement("div");
          name.className = "result-name";
          name.textContent = namesToShow[0];
          winnersList.append(name);
          return;
        }

        namesToShow.forEach((winner, index) => {
          const row = document.createElement("div");
          row.className = "winner-row";
          const number = document.createElement("span");
          number.className = "winner-number";
          number.textContent = String(index + 1);
          const name = document.createElement("span");
          name.className = "winner-name";
          name.textContent = winner;
          row.append(number, name);
          winnersList.append(row);
        });
      }

      function formatTime(value) {
        return new Intl.DateTimeFormat("zh-CN", { hour: "2-digit", minute: "2-digit" }).format(new Date(value));
      }

      function renderHistory() {
        historyList.replaceChildren();
        clearHistoryButton.disabled = history.length === 0;

        if (history.length === 0) {
          const empty = document.createElement("p");
          empty.className = "history-empty";
          empty.textContent = "抽取结果会显示在这里";
          historyList.append(empty);
          return;
        }

        history.forEach((entry) => {
          const row = document.createElement("div");
          row.className = "history-entry";
          const pickedNames = document.createElement("span");
          pickedNames.className = "history-names";
          pickedNames.textContent = entry.names.join("、");
          const time = document.createElement("time");
          time.className = "history-time";
          time.dateTime = entry.time;
          time.textContent = formatTime(entry.time);
          row.append(pickedNames, time);
          historyList.append(row);
        });
      }

      function beginDraw() {
        if (isDrawing || names.length === 0) return;

        const requestedCount = Math.min(Number.parseInt(drawCountInput.value, 10) || 1, names.length);
        let pool = lastWinner ? names.filter((name) => name !== lastWinner) : [...names];
        if (pool.length < requestedCount) pool = [...names];

        const chosen = shuffled(pool).slice(0, requestedCount);
        const startedAt = Date.now();
        isDrawing = true;
        drawButton.disabled = true;
        drawButtonLabel.textContent = "正在抽取…";
        resultEmpty.hidden = true;
        winnersList.hidden = false;
        resultCaption.textContent = "抽取中";

        const animation = window.setInterval(() => {
          const preview = pool[randomIndex(pool.length)];
          winnersList.replaceChildren();
          const name = document.createElement("div");
          name.className = "result-name";
          name.textContent = preview;
          winnersList.append(name);
        }, 80);

        window.setTimeout(() => {
          window.clearInterval(animation);
          const elapsed = Date.now() - startedAt;
          lastWinner = chosen[chosen.length - 1];
          setResult(chosen, chosen.length === 1 ? "本次抽中" : `本次抽中 ${chosen.length} 人`);

          history.unshift({ names: chosen, time: new Date().toISOString() });
          history = history.slice(0, historyLimit);
          saveStorage(historyKey, JSON.stringify(history));
          renderHistory();

          window.setTimeout(() => {
            isDrawing = false;
            drawButton.disabled = names.length === 0;
            drawButtonLabel.textContent = "开始抽取";
          }, Math.max(0, 520 - elapsed));
        }, 850);
      }

      rosterInput.value = readStorage(rosterKey, "");
      try {
        const savedHistory = JSON.parse(readStorage(historyKey, "[]"));
        history = Array.isArray(savedHistory)
          ? savedHistory.filter((entry) => Array.isArray(entry.names) && typeof entry.time === "string").slice(0, historyLimit)
          : [];
        if (history[0] && history[0].names.length) lastWinner = history[0].names[history[0].names.length - 1];
      } catch {
        history = [];
      }

      rosterInput.addEventListener("input", updateRoster);
      drawCountInput.addEventListener("change", syncCountControl);
      decreaseCountButton.addEventListener("click", () => {
        drawCountInput.value = String(Math.max(1, Number(drawCountInput.value) - 1));
        syncCountControl();
      });
      increaseCountButton.addEventListener("click", () => {
        drawCountInput.value = String(Math.min(names.length, Number(drawCountInput.value) + 1));
        syncCountControl();
      });
      drawButton.addEventListener("click", beginDraw);

      addForm.addEventListener("submit", (event) => {
        event.preventDefault();
        const name = addName.value.trim();
        if (!name) {
          addName.focus();
          return;
        }
        rosterInput.value = rosterInput.value.trim()
          ? `${rosterInput.value.replace(/\s+$/, "")}\n${name}`
          : name;
        updateRoster();
        addName.value = "";
        addName.focus();
      });

      clearRosterButton.addEventListener("click", () => {
        rosterInput.value = "";
        updateRoster();
        lastWinner = "";
        setResult([], "等待开始");
      });

      clearHistoryButton.addEventListener("click", () => {
        history = [];
        lastWinner = "";
        saveStorage(historyKey, "[]");
        renderHistory();
      });

      updateRoster();
      renderHistory();
    })();
  </script>
</body>
</html>
