<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>回声 · Echo</title>
<style>
  :root{
    --bg:#07090d; --wall:#1b2534; --wallEdge:#2c3b52; --floor:#0c1119;
    --cyan:#4de2ff; --red:#ff4d6d; --green:#4dffa6; --text:#dfe9f7; --dim:#7d8ea6;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(900px 500px at 50% 0%, #0d1420 0%, var(--bg) 70%);
    color:var(--text); font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center; user-select:none;
  }
  .wrap{padding:18px}
  .hud{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:14px;color:var(--dim)}
  .hud b{color:var(--text)}
  .bar{width:110px;height:6px;border-radius:3px;background:#16202e;overflow:hidden;margin-left:8px}
  .bar i{display:block;height:100%;width:0;background:var(--cyan);transition:width .08s linear}
  .row{display:flex;align-items:center;gap:6px}
  canvas{display:block;border-radius:12px;background:#04060a;box-shadow:0 20px 50px rgba(0,0,0,.6),inset 0 0 0 1px #152033}
  .tips{margin-top:10px;font-size:12.5px;color:var(--dim);display:flex;gap:14px;flex-wrap:wrap}
  kbd{background:#131b28;border:1px solid #223148;border-bottom-width:2px;border-radius:5px;padding:1px 6px;font-size:12px;color:#a9bcd6}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud">
    <span>碎片 <b id="frag">0</b>/3</span>
    <div class="row">回声 <div class="bar"><i id="cd"></i></div></div>
  </div>
  <canvas id="c" width="588" height="420"></canvas>
  <div class="tips">
    <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>/方向键 移动</span>
    <span><kbd>空格</kbd> 发出回声（会暴露你）</span>
    <span><kbd>R</kbd> 重开</span>
  </div>
</div>
<script>
(() => {
  const COLS = 21, ROWS = 15, CELL = 28, RADIUS = 9;
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const fragEl = document.getElementById('frag');
  const cdEl = document.getElementById('cd');

  const idx = (x, y) => y * COLS + x;
  const inside = (x, y) => x > 0 && y > 0 && x < COLS - 1 && y < ROWS - 1;
  const key = (x, y) => x + ',' + y;

  let maze, seen, player, enemies, frags, exitCell, collected;
  let state, pingT, pingAt, lastPing, enemyClock, lastMove, startAt;

  const COOLDOWN = 1800, ENEMY_STEP = 320, PING_R = 9, FADE = 2600;

  // ---------- 迷宫（递归回溯） ----------
  function genMaze() {
    const m = new Uint8Array(COLS * ROWS).fill(1);
    const stack = [[1, 1]];
    m[idx(1, 1)] = 0;
    while (stack.length) {
      const [x, y] = stack[stack.length - 1];
      const dirs = [[2,0],[-2,0],[0,2],[0,-2]].sort(() => Math.random() - 0.5);
      let moved = false;
      for (const [dx, dy] of dirs) {
        const nx = x + dx, ny = y + dy;
        if (!inside(nx, ny)) continue;
        if (m[idx(nx, ny)] === 1) {
          m[idx(x + dx/2, y + dy/2)] = 0;
          m[idx(nx, ny)] = 0;
          stack.push([nx, ny]);
          moved = true;
          break;
        }
      }
      if (!moved) stack.pop();
    }
    // 打通一些墙，制造环路（避免死胡同太多，敌人可包抄）
    for (let y = 1; y < ROWS - 1; y++) {
      for (let x = 1; x < COLS - 1; x++) {
        if (m[idx(x, y)] !== 1) continue;
        const h = m[idx(x - 1, y)] === 0 && m[idx(x + 1, y)] === 0;
        const v = m[idx(x, y - 1)] === 0 && m[idx(x, y + 1)] === 0;
        if ((h || v) && Math.random() < 0.14) m[idx(x, y)] = 0;
      }
    }
    return m;
  }

  function bfsDist(sx, sy, blocked) {
    const dist = new Int16Array(COLS * ROWS).fill(-1);
    const q = [[sx, sy]];
    dist[idx(sx, sy)] = 0;
    while (q.length) {
      const [x, y] = q.shift();
      const d = dist[idx(x, y)];
      for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
        const nx = x + dx, ny = y + dy;
        if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) continue;
        if (maze[idx(nx, ny)] !== 0) continue;
        if (dist[idx(nx, ny)] !== -1) continue;
        dist[idx(nx, ny)] = d + 1;
        q.push([nx, ny]);
      }
    }
    return dist;
  }

  function openCells() {
    const out = [];
    for (let y = 1; y < ROWS - 1; y++)
      for (let x = 1; x < COLS - 1; x++)
        if (maze[idx(x, y)] === 0) out.push({x, y});
    return out;
  }

  function pathStep(sx, sy, tx, ty) {
    const dist = bfsDist(tx, ty);
    let best = null, bestD = 1e9;
    for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const nx = sx + dx, ny = sy + dy;
      if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) continue;
      if (maze[idx(nx, ny)] !== 0) continue;
      const d = dist[idx(nx, ny)];
      if (d >= 0 && d < bestD) { bestD = d; best = [nx, ny]; }
    }
    return best;
  }

  // ---------- 初始化 ----------
  function reset() {
    maze = genMaze();
    seen = new Float32Array(COLS * ROWS);
    player = {x: 1, y: 1};
    exitCell = {x: COLS - 2, y: ROWS - 2};

    const cells = openCells().filter(c => !(c.x === 1 && c.y === 1) &&
      !(c.x === exitCell.x && c.y === exitCell.y) &&
      Math.abs(c.x - 1) + Math.abs(c.y - 1) > 5);

    frags = [];
    for (let i = 0; i < 3 && cells.length; i++) {
      const k = Math.floor(Math.random() * cells.length);
      const c = cells.splice(k, 1)[0];
      frags.push({x: c.x, y: c.y, got: false});
    }

    const far = openCells()
      .filter(c => Math.abs(c.x - 1) + Math.abs(c.y - 1) > 10)
      .sort(() => Math.random() - 0.5)
      .slice(0, 2);
    enemies = far.map(c => ({x: c.x, y: c.y, target: null, next: 0}));

    collected = 0;
    state = 'play';
    pingT = -9999;
    pingAt = {x: 1, y: 1};
    lastPing = -9999;
    enemyClock = 0;
    lastMove = 0;
    startAt = performance.now();
    fragEl.textContent = '0';
    reveal(player.x, player.y, 3.2);
    draw();
  }

  // ---------- 感知 ----------
  function reveal(sx, sy, radius) {
    const now = performance.now();
    const dist = bfsDist(sx, sy);
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        const d = dist[idx(x, y)];
        if (d >= 0 && d <= radius) {
          seen[idx(x, y)] = now;
          for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
            const nx = x + dx, ny = y + dy;
            if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) continue;
            if (maze[idx(nx, ny)] === 1) seen[idx(nx, ny)] = now;
          }
        }
      }
    }
  }

  function doPing() {
    const now = performance.now();
    if (now - lastPing < COOLDOWN) return;
    lastPing = now;
    pingT = now;
    pingAt = {x: player.x, y: player.y};
    reveal(player.x, player.y, PING_R);
    // 听者被惊动
    for (const e of enemies) {
      const d = Math.abs(e.x - player.x) + Math.abs(e.y - player.y);
      if (d <= PING_R * 2) e.target = {x: player.x, y: player.y};
    }
    draw();
  }

  // ---------- 玩家 ----------
  function tryMove(dx, dy) {
    if (state !== 'play') return;
    const now = performance.now();
    if (now - lastMove < 90) return;
    lastMove = now;
    const nx = player.x + dx, ny = player.y + dy;
    if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) return;
    if (maze[idx(nx, ny)] !== 0) return;
    player.x = nx; player.y = ny;
    reveal(nx, ny, 2.2);

    for (const f of frags) {
      if (!f.got && f.x === nx && f.y === ny) {
        f.got = true; collected++;
        fragEl.textContent = String(collected);
      }
    }
    if (collected === 3 && nx === exitCell.x && ny === exitCell.y) {
      state = 'win';
    }
    draw();
  }

  // ---------- 敌人 ----------
  function stepEnemies(now) {
    for (const e of enemies) {
      if (now < e.next) continue;
      e.next = now + ENEMY_STEP;
      let tx = e.target ? e.target.x : null, ty = e.target ? e.target.y : null;
      if (tx === null) {
        // 没听到声音：在人附近游荡
        const d = Math.abs(e.x - player.x) + Math.abs(e.y - player.y);
        if (d <= 4) { tx = player.x; ty = player.y; }
      }
      let nx = e.x, ny = e.y;
      if (tx !== null && (tx !== e.x || ty !== e.y)) {
        const st = pathStep(e.x, e.y, tx, ty);
        if (st) { nx = st[0]; ny = st[1]; }
      } else {
        const opts = [[1,0],[-1,0],[0,1],[0,-1]].filter(([dx, dy]) =>
          maze[idx(e.x + dx, e.y + dy)] === 0);
        if (opts.length) {
          const [dx, dy] = opts[Math.floor(Math.random() * opts.length)];
          nx = e.x + dx; ny = e.y + dy;
        }
      }
      e.x = nx; e.y = ny;
      if (nx === player.x && ny === player.y) state = 'lose';
      if (e.target && Math.abs(e.x - e.target.x) + Math.abs(e.y - e.target.y) <= 1) e.target = null;
    }
  }

  // ---------- 渲染 ----------
  function alphaOf(i, now) {
    const t = seen[i];
    if (!t) return 0;
    const a = 1 - (now - t) / FADE;
    return a > 0 ? a : 0;
  }

  function draw() {
    const now = performance.now();
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#04060a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        const a = alphaOf(idx(x, y), now);
        if (a <= 0) continue;
        const px = x * CELL, py = y * CELL;
        if (maze[idx(x, y)] === 1) {
          ctx.globalAlpha = a * 0.95;
          ctx.fillStyle = '#1b2534';
          ctx.fillRect(px + 1, py + 1, CELL - 2, CELL - 2);
          ctx.globalAlpha = a * 0.5;
          ctx.strokeStyle = '#2c3b52';
          ctx.strokeRect(px + 1.5, py + 1.5, CELL - 3, CELL - 3);
        } else {
          ctx.globalAlpha = a * 0.35;
          ctx.fillStyle = '#0c1119';
          ctx.fillRect(px + 1, py + 1, CELL - 2, CELL - 2);
        }
      }
    }
    ctx.globalAlpha = 1;

    // 出口
    {
      const a = alphaOf(idx(exitCell.x, exitCell.y), now);
      if (a > 0) {
        ctx.globalAlpha = a;
        ctx.strokeStyle = '#4dffa6';
        ctx.lineWidth = 2;
        ctx.strokeRect(exitCell.x*CELL+5, exitCell.y*CELL+5, CELL-10, CELL-10);
        ctx.globalAlpha = 1;
      }
    }

    // 碎片
    for (const f of frags) {
      if (f.got) continue;
      const a = alphaOf(idx(f.x, f.y), now);
      if (a <= 0) continue;
      const cx = f.x*CELL + CELL/2, cy = f.y*CELL + CELL/2;
      ctx.globalAlpha = a;
      ctx.fillStyle = '#4de2ff';
      ctx.shadowColor = '#4de2ff'; ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.moveTo(cx, cy - 7); ctx.lineTo(cx + 6, cy); ctx.lineTo(cx, cy + 7); ctx.lineTo(cx - 6, cy);
      ctx.closePath(); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
    }

    // 敌人
    for (const e of enemies) {
      const a = alphaOf(idx(e.x, e.y), now);
      if (a <= 0) continue;
      const cx = e.x*CELL + CELL/2, cy = e.y*CELL + CELL/2;
      const pulse = 0.7 + 0.3 * Math.sin(now / 180);
      ctx.globalAlpha = a;
      ctx.fillStyle = '#ff4d6d';
      ctx.shadowColor = '#ff4d6d'; ctx.shadowBlur = 16 * pulse;
      ctx.beginPath(); ctx.arc(cx, cy, 7 * pulse, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
    }

    // 玩家
    {
      const cx = player.x*CELL + CELL/2, cy = player.y*CELL + CELL/2;
      ctx.fillStyle = '#eaf6ff';
      ctx.shadowColor = '#9fdcff'; ctx.shadowBlur = 12;
      ctx.beginPath(); ctx.arc(cx, cy, 6, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
    }

    // 回声波纹
    const age = now - pingT;
    if (age >= 0 && age < 900) {
      const r = (age / 900) * PING_R * CELL;
      ctx.globalAlpha = (1 - age / 900) * 0.5;
      ctx.strokeStyle = '#4de2ff';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(pingAt.x*CELL + CELL/2, pingAt.y*CELL + CELL/2, r, 0, Math.PI*2); ctx.stroke();
      ctx.globalAlpha = 1;
    }

    if (state === 'win') overlay('你走了出去', '按 R 再来一次', '#4dffa6');
    if (state === 'lose') overlay('被听见了', '按 R 再来一次', '#ff4d6d');
  }

  function overlay(title, sub, color) {
    ctx.fillStyle = 'rgba(4,6,10,.78)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.textAlign = 'center';
    ctx.fillStyle = color;
    ctx.font = 'bold 34px "Microsoft YaHei", sans-serif';
    ctx.fillText(title, canvas.width/2, canvas.height/2 - 8);
    ctx.fillStyle = '#8fa3bd';
    ctx.font = '15px "Microsoft YaHei", sans-serif';
    ctx.fillText(sub, canvas.width/2, canvas.height/2 + 28);
  }

  // ---------- 主循环 ----------
  function frame() {
    const now = performance.now();
    if (state === 'play') stepEnemies(now);
    draw();

    const cd = Math.min(1, (now - lastPing) / COOLDOWN);
    cdEl.style.width = (cd * 100).toFixed(0) + '%';
    cdEl.style.background = cd >= 1 ? '#4de2ff' : '#33506b';

    requestAnimationFrame(frame);
  }

  // ---------- 输入 ----------
  const map = {
    ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0],
    w:[0,-1], s:[0,1], a:[-1,0], d:[1,0],
    W:[0,-1], S:[0,1], A:[-1,0], D:[1,0]
  };
  window.addEventListener('keydown', (e) => {
    if (e.key === ' ') { e.preventDefault(); if (state === 'play') doPing(); return; }
    if (e.key === 'r' || e.key === 'R') { reset(); return; }
    const m = map[e.key];
    if (m) { e.preventDefault(); tryMove(m[0], m[1]); }
  });

  reset();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
